<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOSBox-X Runner</title>
    <script src="lib/emulators.js"></script>
    <script src="lib/fflate.min.js"></script>
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
        }
        #canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #111;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
            cursor: none;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            padding: 5px;
            background: rgba(0,0,0,0.5);
            font-size: 10px;
            pointer-events: none;
            display: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #controls {
            padding: 5px;
            background: #333;
            display: flex;
            gap: 10px;
            font-size: 12px;
            align-items: center;
        }
        button {
            cursor: pointer;
            background: #555;
            color: white;
            border: 1px solid #777;
            padding: 2px 8px;
        }
        button:hover {
            background: #666;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="loading">Initialzing DOSBox-X...</div>
        <canvas id="dos-canvas"></canvas>
        <div id="ui-overlay">DOSBox-X Direct Mode</div>
    </div>
    <div id="controls">
        <span>DOSBox-X</span>
        <button id="btn-save">Save Progress</button>
        <button id="btn-fullscreen">Fullscreen</button>
        <span id="status">Ready</span>
    </div>

    <script>
        const canvas = document.getElementById("dos-canvas");
        const ctx = canvas.getContext("2d", { alpha: false });
        const btnSave = document.getElementById("btn-save");
        const btnFullscreen = document.getElementById("btn-fullscreen");
        const statusEl = document.getElementById("status");

        const log = (msg) => {
            console.log(msg);
            if (window.parent && window.parent.console) window.parent.console.log(msg);
        };

        let ci = null;
        let audioContext = null;
        let audioQueue = [];
        let processor = null;

        const keyCodeToScanCode = {
            8: 0x0E, 9: 0x0F, 13: 0x1C, 16: 0x2A, 17: 0x1D, 18: 0x38, 19: 0x45, 20: 0x3A,
            27: 0x01, 32: 0x39, 33: 0x49, 34: 0x51, 35: 0x4F, 36: 0x47, 37: 0x4B, 38: 0x48,
            39: 0x4D, 40: 0x50, 45: 0x52, 46: 0x53,
            48: 0x0B, 49: 0x02, 50: 0x03, 51: 0x04, 52: 0x05, 53: 0x06, 54: 0x07, 55: 0x08, 56: 0x09, 57: 0x0A,
            65: 0x1E, 66: 0x30, 67: 0x2E, 68: 0x20, 69: 0x12, 70: 0x21, 71: 0x22, 72: 0x23, 73: 0x17, 74: 0x24,
            75: 0x25, 76: 0x26, 77: 0x32, 78: 0x31, 79: 0x18, 80: 0x19, 81: 0x10, 82: 0x13, 83: 0x1F, 84: 0x14,
            85: 0x16, 86: 0x2F, 87: 0x11, 88: 0x2D, 89: 0x15, 90: 0x2C,
            112: 0x3B, 113: 0x3C, 114: 0x3D, 115: 0x3E, 116: 0x3F, 117: 0x40, 118: 0x41, 119: 0x42, 120: 0x43, 121: 0x44, 122: 0x57, 123: 0x58
        };

        async function initAudio(freq) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: freq });
            processor = audioContext.createScriptProcessor(2048, 0, 1);
            processor.onaudioprocess = (e) => {
                const output = e.outputBuffer.getChannelData(0);
                for (let i = 0; i < output.length; i++) {
                    output[i] = audioQueue.shift() || 0;
                }
            };
            processor.connect(audioContext.destination);
            log(`[DOSBox-X] Audio initialized at ${freq}Hz`);
        }

        function pushAudio(samples) {
            for (let i = 0; i < samples.length; i++) {
                audioQueue.push(samples[i]);
            }
            // Limit queue size to avoid excessive latency (about 0.2s at 44.1kHz)
            if (audioQueue.length > 8192) {
                audioQueue.splice(0, audioQueue.length - 8192);
            }
        }

        async function run() {
            try {
                const params = new URLSearchParams(window.location.search);
                const executable = params.get("executable");
                const directory = params.get("directory");
                const fs = window.parent.fs;

                if (!fs) throw new Error("ZenFS not found");

                statusEl.textContent = "Loading files...";

                const initFs = [];
                const readRecursive = async (curr, rel) => {
                    const entries = await fs.promises.readdir(curr);
                    for (const entry of entries) {
                        if (entry === "." || entry === "..") continue;
                        const full = curr + (curr.endsWith("/") ? "" : "/") + entry;
                        const stat = await fs.promises.stat(full);
                        const relPath = rel ? rel + "/" + entry : entry;
                        if (stat.isDirectory()) {
                            if (curr === "/C:" && (entry === "WINDOWS" || entry === "Program Files")) continue;
                            await readRecursive(full, relPath);
                        } else {
                            const data = await fs.promises.readFile(full);
                            initFs.push({ path: relPath, contents: new Uint8Array(data) });
                        }
                    }
                };

                await readRecursive(directory, "");

                // Add dosbox.conf
                initFs.push({
                    path: ".jsdos/dosbox.conf",
                    contents: new TextEncoder().encode(`[dos]\nxms=true\nems=true\numb=true\n[config]\nmemsize=32\n[autoexec]\nmount c .\nc:\n${executable}\n`)
                });

                statusEl.textContent = "Starting Emulator...";
                emulators.pathPrefix = "lib/";

                ci = await emulators.dosboxXWorker(initFs);
                window.ci = ci; // For parent to access

                document.getElementById("loading").style.display = "none";
                statusEl.textContent = "Running";

                ci.events().onFrameSize((width, height) => {
                    canvas.width = width;
                    canvas.height = height;
                    log(`[DOSBox-X] Frame size: ${width}x${height}`);
                });

                ci.events().onFrame((rgb, rgba) => {
                    if (rgba) {
                        const imageData = new ImageData(new Uint8ClampedArray(rgba), canvas.width, canvas.height);
                        ctx.putImageData(imageData, 0, 0);
                    } else if (rgb) {
                        const rgbaData = new Uint8ClampedArray(canvas.width * canvas.height * 4);
                        for (let i = 0; i < rgb.length / 3; i++) {
                            rgbaData[i * 4] = rgb[i * 3];
                            rgbaData[i * 4 + 1] = rgb[i * 3 + 1];
                            rgbaData[i * 4 + 2] = rgb[i * 3 + 2];
                            rgbaData[i * 4 + 3] = 255;
                        }
                        const imageData = new ImageData(rgbaData, canvas.width, canvas.height);
                        ctx.putImageData(imageData, 0, 0);
                    }
                });

                ci.events().onSoundPush((samples) => {
                    if (!audioContext) {
                        initAudio(ci.soundFrequency());
                    }
                    pushAudio(samples);
                });

                ci.events().onExit(() => {
                    statusEl.textContent = "Exited";
                    log("[DOSBox-X] Emulator exited");
                });

                // Input handling
                window.addEventListener("keydown", (e) => {
                    if (ci) {
                        const scanCode = keyCodeToScanCode[e.keyCode];
                        if (scanCode !== undefined) {
                            ci.sendKeyEvent(scanCode, true);
                            e.preventDefault();
                        }
                    }
                });
                window.addEventListener("keyup", (e) => {
                    if (ci) {
                        const scanCode = keyCodeToScanCode[e.keyCode];
                        if (scanCode !== undefined) {
                            ci.sendKeyEvent(scanCode, false);
                            e.preventDefault();
                        }
                    }
                });

                canvas.addEventListener("mousemove", (e) => {
                    if (ci) {
                        const rect = canvas.getBoundingClientRect();
                        const x = ((e.clientX - rect.left) / rect.width) * canvas.width;
                        const y = ((e.clientY - rect.top) / rect.height) * canvas.height;
                        ci.sendMouseMotion(x, y);
                    }
                });

                canvas.addEventListener("mousedown", (e) => {
                    if (ci) {
                        if (audioContext && audioContext.state === 'suspended') audioContext.resume();
                        ci.sendMouseButton(e.button, true);
                    }
                });

                canvas.addEventListener("mouseup", (e) => {
                    if (ci) {
                        ci.sendMouseButton(e.button, false);
                    }
                });

                // Block context menu
                canvas.addEventListener("contextmenu", e => e.preventDefault());

                // Persistence
                async function persist() {
                    statusEl.textContent = "Saving...";
                    try {
                        const changes = await ci.persist(true);
                        if (changes) {
                            window.parent.postMessage({
                                type: "dosbox-persistence",
                                changes: changes,
                                directory: directory
                            }, "*");
                            statusEl.textContent = "Saved";
                            setTimeout(() => { if (statusEl.textContent === "Saved") statusEl.textContent = "Running"; }, 2000);
                        } else {
                            statusEl.textContent = "Running (No changes)";
                        }
                    } catch (err) {
                        log("[DOSBox-X] Persistence error: " + err.message);
                        statusEl.textContent = "Save Failed";
                    }
                }

                btnSave.addEventListener("click", persist);

                // Auto-persist every 30 seconds
                setInterval(persist, 30000);

                // Persist on close
                window.addEventListener("beforeunload", () => {
                    persist();
                });

            } catch (e) {
                log("[DOSBox-X] Error: " + e.message);
                document.getElementById("loading").textContent = "Error: " + e.message;
                statusEl.textContent = "Error";
            }
        }

        btnFullscreen.addEventListener("click", () => {
            if (canvas.requestFullscreen) {
                canvas.requestFullscreen();
            } else if (canvas.webkitRequestFullscreen) {
                canvas.webkitRequestFullscreen();
            }
        });

        run();
    </script>
</body>
</html>
