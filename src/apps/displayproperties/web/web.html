<div class="web-tab">
    <div class="monitor-preview-container">
        <div class="monitor-preview">
            <div class="screen-preview active-desktop-preview">
                <!-- Preview elements will be injected here -->
            </div>
        </div>
    </div>

    <div class="active-desktop-toggle">
        <input type="checkbox" id="enable-active-desktop" />
        <label for="enable-active-desktop"
            >Show Web content on my Active Desktop</label
        >
    </div>

    <fieldset class="web-items-fieldset">
        <legend>Web items:</legend>
        <div class="web-items-container">
            <div class="web-items-list-wrapper inset-deep">
                <ul id="web-items-list" class="web-items-list">
                    <!-- Items will be injected here -->
                </ul>
            </div>
            <div class="web-items-buttons">
                <button id="new-web-item">New...</button>
                <button id="delete-web-item" disabled>Delete</button>
                <button id="properties-web-item" disabled>Properties</button>
            </div>
        </div>
    </fieldset>

    <div class="folder-options-container">
        <button id="folder-options">Folder Options</button>
    </div>
</div>
