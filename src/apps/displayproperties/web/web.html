<div id="web-tab">
    <div class="active-desktop-preview-container">
        <div class="active-desktop-preview">
            <!-- Items will be rendered here -->
        </div>
    </div>
    <div class="web-content-options">
        <input type="checkbox" id="enable-active-desktop">
        <label for="enable-active-desktop">Show Web content on my Active Desktop</label>
    </div>
    <div class="web-items-section sunken-panel">
        <div class="web-items-header">Web items:</div>
        <ul id="web-items-list">
            <!-- Web items will be listed here -->
        </ul>
    </div>
    <div class="web-item-buttons">
        <button id="new-web-item">New...</button>
        <button id="delete-web-item" disabled>Delete</button>
        <button id="properties-web-item" disabled>Properties</button>
    </div>
    <div class="web-footer-buttons">
        <button id="folder-options">Folder Options</button>
    </div>
</div>
